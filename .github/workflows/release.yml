# 推送 v* 标签时发布到 npm，并附带构建来源证明（provenance）。
# Publishes to npm when a v* tag is pushed, attaching a build provenance statement.
name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动补发，例如首次发布或重试失败的发布。
  # Allows a manual publish, for example the first release or retrying a failed one.
  workflow_dispatch:

# npm provenance 需要 OIDC 令牌；其余权限保持只读。
# npm provenance needs an OIDC token; every other permission stays read-only.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint, typecheck, and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build library
        run: pnpm build:lib
      # 标签与 package.json 的版本必须一致，避免发布出错误的版本号。
      # The tag and the package.json version must match so a wrong version is never published.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/vue-flow-upload/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package version $version"
            exit 1
          fi
      - name: Publish to npm
        working-directory: packages/vue-flow-upload
        run: npm publish --provenance --access public
        env:
          # 在仓库 Secrets 中配置 NPM_TOKEN；也可以改用 npm 的 Trusted Publishing 免令牌发布。
          # Configure NPM_TOKEN in repository secrets; npm Trusted Publishing can replace it token-free.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
